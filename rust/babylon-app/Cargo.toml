[package]
name = "babylon-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "babylon_app"
path = "src/lib.rs"

[[bin]]
name = "FalloutBabylon"
path = "src/main.rs"

[dependencies]
babylon-core = { path = "../babylon-core" }
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
png = "0.17"
rfd = "0.15"
arboard = "3"
open = "5"
dirs = "5"
sys-locale = "0.3"
serde_json = "1"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
i-slint-backend-testing = "1.18"
tempfile = "3"
