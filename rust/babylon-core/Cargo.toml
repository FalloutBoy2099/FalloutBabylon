[package]
name = "babylon-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
encoding_rs = "0.8"
regex = "1"
fancy-regex = "0.13"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
